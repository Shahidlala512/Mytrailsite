<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Search Engine</title>
  <style>
    body { background: #0b0f19; color: #fff; font-family: sans-serif; padding: 20px; text-align: center; margin: 0; }
    .search-box { margin: 20px auto; max-width: 500px; display: flex; gap: 10px; }
    input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #fff; }
    button { padding: 12px 20px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 20px; }
    .card { background: #1e293b; border-radius: 8px; overflow: hidden; border: 1px solid #334155; text-align: left; display: flex; flex-direction: column; justify-content: space-between; }
    .card img { width: 100%; height: 220px; object-fit: cover; }
    .card-title { font-size: 12px; padding: 8px; font-weight: bold; color: #38bdf8; height: 35px; overflow: hidden; }
    .btn-dl { background: #166534; color: #fff; text-align: center; padding: 10px; font-size: 12px; font-weight: bold; margin: 8px; border-radius: 4px; border: none; cursor: pointer; }

    /* Modal Popup Styling */
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); }
    .modal-content { background: #1e293b; margin: 15% auto; padding: 20px; border-radius: 12px; max-width: 450px; width: 85%; color: #fff; text-align: center; border: 1px solid #334155; position: relative; }
    .close-btn { position: absolute; right: 15px; top: 10px; font-size: 24px; cursor: pointer; color: #94a3b8; }
    .dl-btn-single { display: block; background: #2563eb; color: #fff; padding: 12px; margin: 10px 0; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 13px; text-align: center; }
    .dl-btn-single:hover { background: #1d4ed8; }
  </style>
</head>
<body>

  <h2>Movie Search Engine</h2>

  <div class="search-box">
    <input type="text" id="query" placeholder="Search Movie..." value="Hindi">
    <button onclick="fetchScrapedData()">Search</button>
  </div>

  <div id="status" style="color: #94a3b8;">Click search to fetch movies...</div>
  <div class="grid" id="movieGrid"></div>

  <!-- Popup Modal for Links -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h3 id="modalTitle" style="color: #38bdf8; font-size: 15px;">Download Links</h3>
      <div id="modalBody" style="margin-top: 15px;">Loading links...</div>
    </div>
  </div>

  <script>
    async function fetchScrapedData() {
      const q = document.getElementById('query').value;
      const status = document.getElementById('status');
      const grid = document.getElementById('movieGrid');

      status.innerText = 'Searching...';
      grid.innerHTML = '';

      try {
        const res = await fetch(`/api/scrape?query=${encodeURIComponent(q)}`);
        const json = await res.json();

        if (!json.success || !json.data || json.data.length === 0) {
          status.innerText = 'No movies found!';
          return;
        }

        status.innerText = `Found ${json.count} movies:`;
        json.data.forEach(item => {
          const safeTitle = item.title.replace(/'/g, "\\'");
          const safeUrl = encodeURIComponent(item.pageUrl);

          grid.innerHTML += `
            <div class="card">
              <img src="${item.poster}" alt="Poster">
              <div class="card-title">${item.title}</div>
              <button class="btn-dl" onclick="openDownloadModal('${safeUrl}', '${safeTitle}')">📥 Get File Links</button>
            </div>
          `;
        });
      } catch (err) {
        status.innerText = 'Error loading movies!';
      }
    }

    async function openDownloadModal(encodedUrl, title) {
      const modal = document.getElementById('modal');
      const modalTitle = document.getElementById('modalTitle');
      const modalBody = document.getElementById('modalBody');

      modal.style.display = 'block';
      modalTitle.innerText = title;
      modalBody.innerHTML = '<p style="color:#94a3b8;">Fetching download links... Please wait...</p>';

      try {
        const res = await fetch(`/api/scrape?detailUrl=${encodedUrl}`);
        const json = await res.json();

        if (!json.success || !json.links || json.links.length === 0) {
          modalBody.innerHTML = '<p style="color:#ef4444;">No links found for this movie.</p>';
          return;
        }

        modalBody.innerHTML = '';
        json.links.forEach(link => {
          modalBody.innerHTML += `
            <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="dl-btn-single">
              ${link.name}
            </a>
          `;
        });
      } catch (err) {
        modalBody.innerHTML = '<p style="color:#ef4444;">Failed to fetch download links!</p>';
      }
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }
  </script>

</body>
</html>
