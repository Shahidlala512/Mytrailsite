<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Scraper Engine</title>
  <style>
    body { background: #0b0f19; color: #fff; font-family: Arial, sans-serif; padding: 20px; text-align: center; }
    .search-box { margin: 20px auto; max-width: 500px; display: flex; gap: 10px; }
    input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #fff; }
    button { padding: 12px 20px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 20px; }
    .card { background: #1e293b; border-radius: 8px; overflow: hidden; border: 1px solid #334155; text-align: left; }
    .card img { width: 100%; height: 220px; object-fit: cover; }
    .card-title { font-size: 12px; padding: 8px; font-weight: bold; color: #38bdf8; height: 35px; overflow: hidden; }
    .btn-dl { display: block; background: #166534; color: #fff; text-align: center; padding: 8px; text-decoration: none; font-size: 12px; font-weight: bold; margin: 5px; border-radius: 4px; }
  </style>
</head>
<body>

  <h2>Live Scraper Engine</h2>

  <div class="search-box">
    <input type="text" id="query" placeholder="Movie Search (e.g. Hindi, Avatar)" value="Hindi">
    <button onclick="fetchScrapedData()">Scrape Target Site</button>
  </div>

  <div id="status" style="color: #94a3b8;">Click button to trigger cloud scraper...</div>
  <div class="grid" id="movieGrid"></div>

  <script>
    async function fetchScrapedData() {
      const q = document.getElementById('query').value;
      const status = document.getElementById('status');
      const grid = document.getElementById('movieGrid');

      status.innerText = 'Scraping in progress...';
      grid.innerHTML = '';

      try {
        const res = await fetch(`/api/scrape?query=${encodeURIComponent(q)}`);
        const json = await res.json();

        if (!json.success) {
          status.innerText = `Error: ${json.error}`;
          return;
        }

        if (!json.data || json.data.length === 0) {
          status.innerText = 'No items found on target site!';
          return;
        }

        status.innerText = `Found ${json.count} movies:`;
        json.data.forEach(item => {
          grid.innerHTML += `
            <div class="card">
              <img src="${item.poster}" alt="Poster">
              <div class="card-title">${item.title}</div>
              <a href="${item.pageUrl}" target="_blank" class="btn-dl">📥 Get File Links</a>
            </div>
          `;
        });
      } catch (err) {
        status.innerText = 'API Route Not Found (Check GitHub api/scrape.js folder structure)';
      }
    }
  </script>

</body>
</html>
